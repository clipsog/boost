services:
  - type: web
    name: boost
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: ZEFAME_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: ZEFAME_VIEWS_SERVICE
        value: "953"
      - key: ZEFAME_LIKES_SERVICE
        value: "1109"
      - key: ZEFAME_ASSUMED_BOOST_HOURS
        value: "8"
      - key: ZEFAME_ASSUMED_BOOST_ET_CUTOFF_HOUR
        value: "17"
      - key: BOOST_ADMIN_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.13"
